<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title description">
  <title id="title">Railway Network Simulator</title>
  <desc id="description">A precise diagram of towns connected by railway lines moving through construction, single-track, upgrading, and dual-track service.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3EB"/>
      <stop offset="1" stop-color="#E4EFEA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#173D36" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#8A3F2D"/>
    </marker>
  </defs>

  <rect width="1440" height="720" rx="36" fill="url(#background)"/>
  <circle cx="1290" cy="100" r="180" fill="#D7E8E1" opacity="0.65"/>
  <circle cx="85" cy="680" r="230" fill="#F0D9CC" opacity="0.5"/>

  <g transform="translate(84 80)">
    <rect width="82" height="82" rx="24" fill="#173D36"/>
    <path d="M19 51H63M23 41H59M29 31H53" fill="none" stroke="#F7F3EB" stroke-width="6" stroke-linecap="round"/>
    <circle cx="27" cy="59" r="6" fill="#D97B59"/>
    <circle cx="55" cy="59" r="6" fill="#D97B59"/>
  </g>

  <text x="190" y="112" fill="#173D36" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="3">EVENT-DRIVEN INFRASTRUCTURE</text>
  <text x="84" y="235" fill="#173D36" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800">Railway Network</text>
  <text x="84" y="310" fill="#8A3F2D" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800">Simulator</text>
  <text x="88" y="365" fill="#385D55" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24">Towns grow. Tracks evolve. Freight keeps moving.</text>

  <g transform="translate(84 422)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="220" height="76" rx="20" fill="#FFFFFF" opacity="0.86"/>
    <circle cx="34" cy="38" r="17" fill="#D97B59"/>
    <text x="64" y="34" fill="#173D36" font-size="15" font-weight="700">Validated events</text>
    <text x="64" y="56" fill="#667A74" font-size="13">ordered network growth</text>

    <rect x="236" width="220" height="76" rx="20" fill="#FFFFFF" opacity="0.86"/>
    <circle cx="270" cy="38" r="17" fill="#2A6F62"/>
    <text x="300" y="34" fill="#173D36" font-size="15" font-weight="700">Stateful tracks</text>
    <text x="300" y="56" fill="#667A74" font-size="13">explicit lifecycle policy</text>

    <rect x="472" width="220" height="76" rx="20" fill="#FFFFFF" opacity="0.86"/>
    <circle cx="506" cy="38" r="17" fill="#C69A43"/>
    <text x="536" y="34" fill="#173D36" font-size="15" font-weight="700">Observable output</text>
    <text x="536" y="56" fill="#667A74" font-size="13">console + Graphviz</text>
  </g>

  <g transform="translate(840 128)" filter="url(#shadow)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="500" height="474" rx="32" fill="#173D36"/>

    <path d="M90 119C150 119 160 191 225 191S300 115 372 115" fill="none" stroke="#D7E8E1" stroke-width="8" stroke-linecap="round"/>
    <path d="M90 127C150 127 160 199 225 199S300 123 372 123" fill="none" stroke="#D7E8E1" stroke-width="3" stroke-linecap="round"/>
    <path d="M226 205C226 271 300 273 371 273" fill="none" stroke="#D97B59" stroke-width="7" stroke-linecap="round" stroke-dasharray="13 12"/>
    <path d="M91 126C90 234 139 328 229 347" fill="none" stroke="#97C6B8" stroke-width="7" stroke-linecap="round"/>
    <path d="M229 347C287 351 320 319 372 273" fill="none" stroke="#F0D9CC" stroke-width="8" stroke-linecap="round"/>
    <path d="M229 355C287 359 320 327 372 281" fill="none" stroke="#F0D9CC" stroke-width="3" stroke-linecap="round"/>

    <g fill="#F7F3EB" stroke="#D97B59" stroke-width="5">
      <circle cx="90" cy="123" r="25"/>
      <circle cx="226" cy="195" r="25"/>
      <circle cx="373" cy="119" r="25"/>
      <circle cx="373" cy="277" r="25"/>
      <circle cx="229" cy="351" r="25"/>
    </g>
    <g fill="#173D36">
      <circle cx="90" cy="123" r="7"/>
      <circle cx="226" cy="195" r="7"/>
      <circle cx="373" cy="119" r="7"/>
      <circle cx="373" cy="277" r="7"/>
      <circle cx="229" cy="351" r="7"/>
    </g>

    <rect x="60" y="401" width="380" height="2" fill="#385D55"/>
    <circle cx="76" cy="433" r="6" fill="#D7E8E1"/>
    <text x="93" y="439" fill="#D7E8E1" font-size="15">single</text>
    <circle cx="187" cy="433" r="6" fill="#F0D9CC"/>
    <text x="204" y="439" fill="#D7E8E1" font-size="15">dual</text>
    <circle cx="280" cy="433" r="6" fill="#D97B59"/>
    <text x="297" y="439" fill="#D7E8E1" font-size="15">upgrading</text>
  </g>

  <path d="M740 580H800" stroke="#8A3F2D" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="84" y="642" fill="#667A74" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" letter-spacing="1.5">JAVA 21 · STATE · FACTORY · OBSERVER · GRAPHVIZ</text>
</svg>
