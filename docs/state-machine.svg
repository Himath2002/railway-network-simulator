<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title description">
  <title id="title">Railway lifecycle</title>
  <desc id="description">Four railway states connected by three precisely aligned transitions.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0 0L11 5.5L0 11Z" fill="#8A3F2D"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173D36" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1440" height="500" rx="30" fill="#F6F4EF"/>
  <text x="72" y="68" fill="#173D36" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="800">One route, four explicit phases</text>
  <text x="72" y="100" fill="#667A74" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Every phase owns capacity, eligibility, transition timing, and graph semantics.</text>

  <g transform="translate(64 160)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" filter="url(#shadow)">
    <g>
      <rect width="265" height="230" rx="26" fill="#FFFFFF" stroke="#D6DEDA"/>
      <rect width="265" height="10" rx="5" fill="#9AA9A4"/>
      <circle cx="40" cy="52" r="18" fill="#E7ECEA"/>
      <path d="M30 52H50" stroke="#667A74" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 5"/>
      <text x="70" y="58" fill="#173D36" font-size="20" font-weight="800">Construction</text>
      <text x="26" y="101" fill="#667A74" font-size="15">Capacity</text>
      <text x="239" y="101" fill="#173D36" font-size="15" font-weight="700" text-anchor="end">0</text>
      <text x="26" y="132" fill="#667A74" font-size="15">Service</text>
      <text x="239" y="132" fill="#173D36" font-size="15" font-weight="700" text-anchor="end">blocked</text>
      <text x="26" y="163" fill="#667A74" font-size="15">Duration</text>
      <text x="239" y="163" fill="#173D36" font-size="15" font-weight="700" text-anchor="end">5 days</text>
      <rect x="24" y="184" width="217" height="28" rx="14" fill="#F0F2F1"/>
      <text x="132.5" y="203" fill="#667A74" font-size="12" font-weight="700" text-anchor="middle">NEW ROUTE</text>
    </g>

    <g transform="translate(337 0)">
      <rect width="265" height="230" rx="26" fill="#FFFFFF" stroke="#D6DEDA"/>
      <rect width="265" height="10" rx="5" fill="#2A6F62"/>
      <circle cx="40" cy="52" r="18" fill="#DCEDE7"/>
      <path d="M29 52H51" stroke="#2A6F62" stroke-width="4" stroke-linecap="round"/>
      <text x="70" y="58" fill="#173D36" font-size="20" font-weight="800">Single track</text>
      <text x="26" y="101" fill="#667A74" font-size="15">Capacity</text>
      <text x="239" y="101" fill="#173D36" font-size="15" font-weight="700" text-anchor="end">100</text>
      <text x="26" y="132" fill="#667A74" font-size="15">Service</text>
      <text x="239" y="132" fill="#173D36" font-size="15" font-weight="700" text-anchor="end">one direction</text>
      <text x="26" y="163" fill="#667A74" font-size="15">Schedule</text>
      <text x="239" y="163" fill="#173D36" font-size="15" font-weight="700" text-anchor="end">alternating</text>
      <rect x="24" y="184" width="217" height="28" rx="14" fill="#DCEDE7"/>
      <text x="132.5" y="203" fill="#2A6F62" font-size="12" font-weight="700" text-anchor="middle">DUPLICATION ELIGIBLE</text>
    </g>

    <g transform="translate(674 0)">
      <rect width="265" height="230" rx="26" fill="#FFFFFF" stroke="#D6DEDA"/>
      <rect width="265" height="10" rx="5" fill="#D97B59"/>
      <circle cx="40" cy="52" r="18" fill="#F7E3D9"/>
      <path d="M29 52H51" stroke="#D97B59" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 4"/>
      <text x="70" y="58" fill="#173D36" font-size="20" font-weight="800">Upgrading</text>
      <text x="26" y="101" fill="#667A74" font-size="15">Capacity</text>
      <text x="239" y="101" fill="#173D36" font-size="15" font-weight="700" text-anchor="end">100</text>
      <text x="26" y="132" fill="#667A74" font-size="15">Service</text>
      <text x="239" y="132" fill="#173D36" font-size="15" font-weight="700" text-anchor="end">maintained</text>
      <text x="26" y="163" fill="#667A74" font-size="15">Duration</text>
      <text x="239" y="163" fill="#173D36" font-size="15" font-weight="700" text-anchor="end">5 days</text>
      <rect x="24" y="184" width="217" height="28" rx="14" fill="#F7E3D9"/>
      <text x="132.5" y="203" fill="#8A3F2D" font-size="12" font-weight="700" text-anchor="middle">LIVE CONVERSION</text>
    </g>

    <g transform="translate(1011 0)">
      <rect width="265" height="230" rx="26" fill="#173D36" stroke="#173D36"/>
      <rect width="265" height="10" rx="5" fill="#C69A43"/>
      <circle cx="40" cy="52" r="18" fill="#315B53"/>
      <path d="M29 48H51M29 56H51" stroke="#F7F3EB" stroke-width="3" stroke-linecap="round"/>
      <text x="70" y="58" fill="#FFFFFF" font-size="20" font-weight="800">Dual track</text>
      <text x="26" y="101" fill="#BFD0CB" font-size="15">Capacity</text>
      <text x="239" y="101" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="end">100 × 2</text>
      <text x="26" y="132" fill="#BFD0CB" font-size="15">Service</text>
      <text x="239" y="132" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="end">both directions</text>
      <text x="26" y="163" fill="#BFD0CB" font-size="15">Lifecycle</text>
      <text x="239" y="163" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="end">stable</text>
      <rect x="24" y="184" width="217" height="28" rx="14" fill="#315B53"/>
      <text x="132.5" y="203" fill="#F7F3EB" font-size="12" font-weight="700" text-anchor="middle">FULL SERVICE</text>
    </g>
  </g>

  <g fill="none" stroke="#8A3F2D" stroke-width="3.5" marker-end="url(#arrow)">
    <path d="M333 275H389"/>
    <path d="M670 275H726"/>
    <path d="M1007 275H1063"/>
  </g>
  <g fill="#8A3F2D" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <text x="361" y="252">5 DAYS</text>
    <text x="698" y="252">REQUEST</text>
    <text x="1035" y="252">5 DAYS</text>
  </g>
</svg>
