name: Bug report
description: Report a reproducible simulation, validation, or rendering defect.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Railway Network Simulator. Please exclude secrets and private data from examples or logs.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: A concise description of the observed and expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest event sequence and exact commands needed to reproduce the issue.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash.
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and JDK version.
      placeholder: macOS 15, Temurin 21
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Relevant output
      description: Paste concise console or DOT output when it helps explain the problem.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and private information from the report.
          required: true
